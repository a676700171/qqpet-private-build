name: Stage verified mobile artifacts in a draft release
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate successful source run and draft target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)" = .github/workflows/mobile-snapshot.yml
          test "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: QQPet-audit-*
          path: artifacts
      - name: Verify and upload only APK and IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          : > MOBILE-SHA256SUMS.txt
          for platform in android ios; do
            directory="artifacts/QQPet-audit-$platform"
            (cd "$directory" && sha256sum -c "SHA256SUMS-$platform.txt")
            if [ "$platform" = android ]; then name="QQPet-$version-android-audit.apk"; else name="QQPet-$version-ios-unsigned.ipa"; fi
            test -f "$directory/$name"
            (cd "$directory" && sha256sum "$name") >> MOBILE-SHA256SUMS.txt
            gh release upload "$RELEASE_TAG" "$directory/$name" -R "$GITHUB_REPOSITORY"
          done
          gh release upload "$RELEASE_TAG" MOBILE-SHA256SUMS.txt -R "$GITHUB_REPOSITORY"
