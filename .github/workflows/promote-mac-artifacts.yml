name: Stage verified Mac artifacts in a draft release
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate successful source run and draft target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)" = .github/workflows/mac-snapshot.yml
          test "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: QQPet-audit-macOS-*
          path: artifacts
      - name: Verify and upload only DMGs and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          : > MAC-SHA256SUMS.txt
          for arch in arm64 x64; do
            directory="artifacts/QQPet-audit-macOS-$arch"
            (cd "$directory" && sed 's#  dist/#  #' SHA256SUMS.txt | sha256sum -c -)
            expected="$arch"
            if [ "$arch" = x64 ]; then expected=x86_64; fi
            grep -Fx "Native architecture: $expected" "$directory/BUILD-NOTES.txt"
            test -f "$directory/QQPet-$version-mac-$arch.dmg"
            (cd "$directory" && sha256sum "QQPet-$version-mac-$arch.dmg") >> MAC-SHA256SUMS.txt
            gh release upload "$RELEASE_TAG" "$directory/QQPet-$version-mac-$arch.dmg" -R "$GITHUB_REPOSITORY"
          done
          cmp artifacts/QQPet-audit-macOS-arm64/SOURCE-SHA256SUMS.txt artifacts/QQPet-audit-macOS-x64/SOURCE-SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" MAC-SHA256SUMS.txt -R "$GITHUB_REPOSITORY"
